name: publish-crate

# Uploads rdp-proto, remora-link, remora-update and remora-client to
# crates.io (docs/RELEASING.md). Manual only: the owner starts it from the
# Actions tab, after the GitHub release for the same tag is published.
# The token is the "crates-io" environment's secret CARGO_REGISTRY_TOKEN;
# only the last step reads it, after a token-less package check. The
# environment can require the owner's approval for each run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  publish:
    # remora-client is a Windows program; the package check builds it.
    runs-on: windows-latest
    timeout-minutes: 60
    environment: crates-io
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the workspace version and is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"') { throw 'No workspace version' }
          $version = $Matches[1]
          if ($env:TAG -cne "v$version") { throw "Tag $env:TAG does not match the workspace version $version" }
          # crates.io versions are permanent; publish stable releases only.
          if ($version.Contains('-')) { throw "$version is a prerelease; publish stable versions only" }
          $sha = git rev-parse "refs/tags/$env:TAG^{commit}"
          if ($LASTEXITCODE) { throw "No tag $env:TAG" }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE) { throw "Tag $env:TAG ($sha) is not on main" }
          "Publishing $version from $sha"
      - name: Licence files match the repository's
        run: |
          foreach ($crate in 'rdp', 'remora', 'remora-link', 'remora-update') {
            foreach ($file in 'LICENSE-MIT', 'LICENSE-APACHE') {
              $a = (Get-FileHash $file).Hash
              $b = (Get-FileHash "crates/$crate/$file").Hash
              if ($a -ne $b) { throw "crates/$crate/$file differs from $file" }
            }
          }
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      - name: Package check (no upload, no token)
        run: |
          cargo package --locked -p rdp-proto -p remora-link -p remora-update -p remora-client
          if ($LASTEXITCODE) { throw 'cargo package failed' }
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked --no-verify -p rdp-proto -p remora-link -p remora-update -p remora-client
          if ($LASTEXITCODE) { throw 'cargo publish failed' }
