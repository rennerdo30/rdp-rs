[workspace]
resolver = "3"
members = ["crates/rdp", "crates/rdpc", "crates/rdpc-update"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
debug = "line-tables-only"

# Dependencies (rustls, ring, minifb, png) are fast at run time and compile once.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Bitmap decoding runs per pixel; keep the protocol crate fast in dev builds too.
[profile.dev.package.rdp]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
