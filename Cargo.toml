[workspace]
resolver = "3"
members = ["crates/rdp", "crates/remora", "crates/remora-agent", "crates/remora-host", "crates/remora-link", "crates/remora-update"]

[workspace.package]
version = "0.1.0-beta.14"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rennerdo30/rdp-rs"
homepage = "https://remora.renner.dev"
rust-version = "1.100"

# The crates published to crates.io (docs/RELEASING.md) depend on each other
# at exactly the workspace version: change these with `version` above (cargo
# refuses a mismatch). On crates.io, `rdp` and `remora` belong to other
# projects, so the library is `rdp-proto` and the app `remora-client`; the
# library and the program keep their names (`use rdp::...`, `remora.exe`).
[workspace.dependencies]
rdp = { package = "rdp-proto", path = "crates/rdp", version = "=0.1.0-beta.14" }
remora-link = { path = "crates/remora-link", version = "=0.1.0-beta.14" }
remora-update = { path = "crates/remora-update", version = "=0.1.0-beta.14" }

[profile.dev]
debug = "line-tables-only"

# Dependencies (rustls, ring, minifb, png) are fast at run time and compile once.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Bitmap decoding runs per pixel; keep the protocol crate fast in dev builds too.
[profile.dev.package.rdp-proto]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
