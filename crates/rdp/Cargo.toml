[package]
name = "rdp-proto"
description = "RDP client protocol implementation written from the Microsoft Open Specifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rdp", "remote-desktop", "protocol", "client", "server"]
categories = ["network-programming"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# `rdp` on crates.io is another project; the library keeps its name.
[lib]
name = "rdp"

[dependencies]
# TLS transport only; every RDP layer above it is implemented in this crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# SHA-256 and the system RNG.
ring = "0.17"
# Wipes the password of a received Client Info PDU (server side).
zeroize = "1.9"

[dev-dependencies]
# Test certificates for the UDP tunnel's TLS (already in the workspace
# through remora-host).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
