[package]
name = "remora-agent"
description = "Remora's server helper: runs in the user's session on a Windows RDP host and talks to the Remora client over its own dynamic virtual channels."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Beyond remora-link (the shared protocol) only windows-sys and windows, both
# already in the workspace at these versions: framing, the task XML, the
# registration plan and the log are small enough to own, and the agent's
# attack surface stays reviewable.
[dependencies]
remora-link = { path = "../remora-link" }

[target.'cfg(windows)'.dependencies]
# COM for the Send To shortcut only (IShellLinkW, IPersistFile).
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
