[package]
name = "rdpc-update"
description = "Update checks for rdpc: GitHub release discovery, version order, checksums, bounded HTTPS downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
