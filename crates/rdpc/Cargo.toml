[package]
name = "rdpc"
description = "Prototype RDP client: connection manager and session windows on the rdp crate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rdp = { path = "../rdp" }
# CPU canvas and text from ffwd (https://github.com/rennerdo30/ffwd, its
# decision 0001), pinned to a published commit.
ffwd-render = { git = "https://github.com/rennerdo30/ffwd", rev = "c79ee208e0763bb639ffde4ee69422a04eaef615" }
winit = "0.30.13"
softbuffer = "0.4.8"
png = "0.18.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
