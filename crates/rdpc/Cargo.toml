[package]
name = "rdpc"
description = "Prototype RDP client: connection manager and session windows on the rdp crate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rdp = { path = "../rdp" }
rdpc-update = { path = "../rdpc-update" }
# CPU canvas and text from ffwd (https://github.com/rennerdo30/ffwd, its
# decision 0001), pinned to a published commit.
ffwd-render = { git = "https://github.com/rennerdo30/ffwd", rev = "97fcd22ba06fc62bf7ab52cb50b7205887190083" }
winit = "0.30.13"
softbuffer = "0.4.8"
png = "0.18.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vault: memory-hard key derivation and authenticated encryption (RustCrypto).
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
# The system folder picker (IFileOpenDialog) for shared folders.
rfd = { version = "0.18.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM interfaces for the Media Foundation H.264 decoder (AVC420 in the
# graphics pipeline); windows-sys has no COM vtables.
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
