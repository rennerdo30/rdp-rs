[package]
name = "remora-client"
description = "Remora, a remote desktop (RDP) client for Windows: connection manager, tabs and session windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rdp", "remote-desktop", "windows", "client"]
categories = ["network-programming", "gui"]
include = [
    "/src/**",
    "/build.rs",
    "/assets/remora.ico",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# `remora` on crates.io is another project; the program keeps the name
# (`cargo install remora-client` installs `remora`).
[[bin]]
name = "remora"
path = "src/main.rs"

# Remora is a Windows program today (docs/RELEASING.md).
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
rdp.workspace = true
# The server helper protocol (Remora::Ctl / Remora::Bulk).
remora-link.workspace = true
remora-update.workspace = true
# CPU canvas and text from ffwd (https://github.com/rennerdo30/ffwd, its
# decision 0001), from crates.io (the same code as ffwd rev 97fcd22).
ffwd-render = "0.1.0"
winit = "0.30.13"
softbuffer = "0.4.8"
png = "0.18.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vault: memory-hard key derivation and authenticated encryption (RustCrypto).
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = "1.9"
# Import from mRemoteNG and RDCMan: XML without DTD entity expansion, and
# mRemoteNG's password scheme (PBKDF2-HMAC-SHA1 from ring, AES-256-GCM with a
# 16-byte nonce).
quick-xml = "0.42"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
ring = "0.17"
# WHATWG URL parsing for the helper's link requests (re-serialized, ASCII
# host) before anything reaches the shell.
url = "2.5.8"
# RDP through an SSH jump host (RDP-88): pure-Rust SSH with ring for its
# crypto (no C toolchain beyond ring's), on a small tokio runtime per tunnel.
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.54", features = ["rt", "net", "time", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
# The system folder picker (IFileOpenDialog) for shared folders.
rfd = { version = "0.18.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    # Listing a server's sessions for shadowing (WTSEnumerateSessionsW).
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM interfaces for the Media Foundation H.264 decoder (AVC420 in the
# graphics pipeline); windows-sys has no COM vtables.
# OLE for the server's clipboard on this PC's clipboard (a data object with
# virtual files, fetched on paste).
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` of the data object and its streams expands to windows-core.
windows-core = "0.100.0"

[dev-dependencies]
# Keys for the in-process SSH jump host in the tunnel tests.
rand = "0.10.4"
