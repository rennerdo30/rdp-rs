[package]
name = "remora-link"
description = "Remora helper protocol: framing, Noise-encrypted sessions, pairing and file transfer (shared by the client and remora-agent)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Noise handshake (Noise_XX_25519_ChaChaPoly_BLAKE2s), RustCrypto backends only.
snow = { version = "0.10.0", default-features = false, features = [
    "std",
    "use-chacha20poly1305",
    "use-blake2",
    "use-curve25519",
    "use-getrandom",
] }
# Per-block file hashes and the SAS derivation. "pure": no C or assembly build step.
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
# Random transfer ids, SAS nonces and bulk tokens from the OS.
getrandom = "0.4"
# Wipes key material when it is dropped.
zeroize = "1.9"
# The pinned-helper store and the transfer sidecar (JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
